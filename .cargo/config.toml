# Download git dependencies through the cli, allowing us for easier private repo usage.
net.git-fetch-with-cli = true

# Using `target.'cfg'` because the three ways of setting rustflags are mutually exclusive:
# https://doc.rust-lang.org/cargo/reference/config.html#buildrustflags
# `target` at least makes it so that array elements are _joined_ with values set elsewhere,
# usually linker speedups in `~/.cargo/config.yaml`.
[target.'cfg(all())']
rustflags = [
    # BEGIN - NOS standard lints
    "-Dunsafe_code",
    "-Wfuture_incompatible",
    "-Wnonstandard_style",
    "-Wrust_2018_idioms",
    "-Wtrivial-numeric-casts",
    "-Wunused-crate-dependencies",
    "-Wunused-qualifications",

    "-Wclippy::as_conversions",
    "-Wclippy::as_pointer_underscore",
    "-Wclippy::checked_conversions",
    "-Wclippy::collapsible_else_if",
    "-Wclippy::dbg_macro",
    "-Wclippy::debug_assert_with_mut_call",
    "-Wclippy::decimal_bitwise_operands",
    "-Wclippy::doc_broken_link",
    "-Wclippy::doc_comment_double_space_linebreaks",
    "-Wclippy::doc_include_without_cfg",
    "-Wclippy::doc_markdown",
    "-Wclippy::doc_paragraphs_missing_punctuation",
    "-Wclippy::empty_enums",
    "-Wclippy::enum_glob_use",
    "-Wclippy::exit",
    "-Wclippy::explicit_deref_methods",
    "-Wclippy::explicit_into_iter_loop",
    "-Wclippy::expl_impl_clone_on_copy",
    "-Wclippy::fallible_impl_from",
    "-Wclippy::filter_map_next",
    "-Wclippy::flat_map_option",
    "-Wclippy::float_cmp",
    "-Wclippy::float_cmp_const",
    "-Wclippy::fn_params_excessive_bools",
    "-Wclippy::get_unwrap",
    "-Wclippy::ignore_without_reason",
    "-Wclippy::implicit_clone",
    "-Wclippy::imprecise_flops",
    "-Wclippy::indexing_slicing",
    "-Wclippy::inefficient_to_string",
    "-Wclippy::inline_trait_bounds",
    "-Wclippy::invalid_upcast_comparisons",
    "-Wclippy::large_digit_groups",
    "-Wclippy::large_stack_arrays",
    "-Wclippy::large_types_passed_by_value",
    "-Wclippy::linkedlist",
    "-Wclippy::lossy_float_literal",
    "-Wclippy::macro_use_imports",
    "-Wclippy::manual_assert_eq",
    "-Wclippy::manual_ilog2",
    "-Wclippy::manual_midpoint",
    "-Wclippy::map_err_ignore",
    "-Wclippy::map_unwrap_or",
    "-Wclippy::match_same_arms",
    "-Wclippy::match_wildcard_for_single_variants",
    "-Wclippy::match_wild_err_arm",
    "-Wclippy::mem_forget",
    "-Wclippy::mutex_integer",
    "-Wclippy::mut_mut",
    "-Wclippy::needless_continue",
    "-Wclippy::needless_for_each",
    "-Wclippy::needless_pass_by_value",
    "-Wclippy::needless_type_cast",
    "-Wclippy::non_send_fields_in_send_ty",
    "-Wclippy::option_option",
    "-Wclippy::path_buf_push_overwrite",
    "-Wclippy::print_stderr",
    "-Wclippy::print_stdout",
    "-Wclippy::ptr_as_ptr",
    "-Wclippy::rc_mutex",
    "-Wclippy::redundant_test_prefix",
    "-Wclippy::ref_option",
    "-Wclippy::ref_option_ref",
    "-Wclippy::rest_pat_in_fully_bound_structs",
    "-Wclippy::same_functions_in_if_condition",
    "-Wclippy::same_length_and_capacity",
    "-Wclippy::single_match_else",
    "-Wclippy::string_add",
    "-Wclippy::string_add_assign",
    "-Wclippy::string_lit_as_bytes",
    "-Wclippy::suboptimal_flops",
    "-Wclippy::todo",
    "-Wclippy::trait_duplication_in_bounds",
    "-Wclippy::trivially_copy_pass_by_ref",
    "-Wclippy::unnecessary_debug_formatting",
    "-Wclippy::unnecessary_literal_bound",
    "-Wclippy::unnecessary_self_imports",
    "-Wclippy::unnecessary_trailing_comma",
    "-Wclippy::unnested_or_patterns",
    "-Wclippy::unused_self",
    "-Wclippy::useless_let_if_seq",
    "-Wclippy::use_self",
    "-Wclippy::verbose_file_reads",
    "-Wclippy::wildcard_imports",
    "-Wclippy::with_capacity_zero",
    "-Wclippy::zero_sized_map_values",

    "-Aclippy::too_many_arguments",
    # END - NOS standard lints
]
