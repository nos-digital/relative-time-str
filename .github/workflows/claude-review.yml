name: Claude Auto Review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    # Skip drafts and bot PRs (dependabot/renovate etc.)
    if: '!github.event.pull_request.draft && !endsWith(github.event.pull_request.user.login, ''[bot]'')'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        # Optional review — must never block the PR (max-turns, API down, etc.)
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            First run `gh pr view ${{ github.event.pull_request.number }}` to read
            the PR title and description, then `gh pr diff ${{ github.event.pull_request.number }}`
            to see the change. Do a lightweight code-quality review of this PR. Focus
            ONLY on small, low-effort, high-confidence improvements that clippy
            and rustfmt do NOT already catch:
            - readability / simplification (clearer naming, less nesting,
              early returns, idiomatic iterators)
            - obvious duplication, or a std/crate helper that already does this
            - clear bug smells (unhandled Result/Option, swallowed errors,
              panics on external input, off-by-one, missing edge cases)
            - leftover dbg!/println! debugging, leftover TODO/FIXME

            Rules:
            - Max 5 suggestions, be concise.
            - Do NOT flag dead code, unused imports/variables, or formatting —
              clippy and rustfmt already enforce those.
            - No style nitpicks, no architecture rewrites, no speculative
              "consider maybe" comments.
            - Respect the PR description: do NOT flag anything the author
              explicitly calls intentional, deliberate, out of scope, or
              deferred to a follow-up PR.
            - If there is nothing worth flagging, do NOT post any comment at
              all — just finish silently.
          claude_args: |
            --max-turns 20
            --model claude-sonnet-5-5
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"
